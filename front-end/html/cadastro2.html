<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style3.css">
  <script src="/js/mask.js" defer></script>
  <script src="/js/cep.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <title>Cadastro parte 02</title>
</head>

<body>

<section class="containerPai">

  <div class="formCadastro" class="erroActive" action="/register" method="POST">
    <h1>cadastro</h1>
    <h2>preencha corretamente os campos obrigatórios.</h2>

    <!-- CADASTRO COMPLETO -->
    <form id="formCadastro2">

      <div class="avatar"> <span class="user-avatar-icon"> <img src="../img/IMG/user-avatar.png" alt="Ícone de usuário"> </span> <span class="user-button"></span> </div>

       <input type="hidden" name="cpf" id="hidden_cpf">
      <input type="hidden" name="email" id="hidden_email">

      <p>Nome</p>
      <div class="input-container">
        <input type="text" name="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="grupoDeInput">
        <div class="little-child">
          <p>Data de nascimento</p>
          <div class="input-container">
            <input type="text" name="data_nascimento" placeholder="DD/MM/AAAA" maxlength="10" class="data" required>
          </div>
        </div>

        <div class="little-child">
          <p>Gênero</p>
          <div class="select-container">
            <select name="genero">
              <option value="">Defina seu gênero</option>
              <option value="male">Homem</option>
              <option value="female">Mulher</option>
              <option value="other">Outro</option>
            </select>
          </div>
        </div>
      </div>

      <p>Cartão do SUS</p>
      <div class="input-container">
        <input type="text" name="sus" placeholder="000 0000 0000 0000" class="sus">
      </div>

      <p>Telefone</p>
      <div class="input-container">
        <input type="text" name="telefone" placeholder="Digite seu telefone" class="telefone">
      </div>

      <p>CEP</p>
      <div class="input-container">
        <input type="text" name="cep" id="cep" placeholder="Digite seu CEP"  onblur="pesquisacep(this.value);" class="cep">
      </div>

      <p>Cidade</p>
      <div class="input-container">
        <input type="text" name="cidade" id="cidade">
      </div>

      <p>Bairro</p>
      <div class="input-container">
        <input type="text" name="bairro" id="bairro">
      </div>

      <div class="grupoDeInput">
        <div class="little-child">
          <p>Rua</p>
          <div class="input-container">
            <input type="text" name="rua" id="rua">
          </div>
        </div>

        <div class="little-child">
          <p>Número</p>
          <div class="input-container">
            <input type="text" name="numero" id="numero">
          </div>
        </div>
      </div>

      <p>Senha</p>
      <div class="input-container">
        <input type="password" name="senha" placeholder="Crie sua senha" minlength="8" required>
      </div>

      <p>Confirmar senha</p>
      <div class="input-container">
        <input type="password" name="confirmar_senha" placeholder="Confirme sua senha" required>
      </div>

      <button type="submit">criar conta</button>

    </form>
  </div>

</section>

</body>
</html>
